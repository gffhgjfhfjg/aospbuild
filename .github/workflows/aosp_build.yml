# =============================================================================
#  AOSP 10 (android-10.0.0_r47) arm64 交叉编译 —— GitHub Actions 分段云端构建
# -----------------------------------------------------------------------------
#  目标产物 : aosp_arm64-eng  镜像 (system.img / vendor.img / odm.img / ...)
#  宿主平台 : GitHub 托管 ubuntu-latest  (x86_64 机器，交叉编译 ARM64 固件)
#  分段策略 : 4 个严格串行 job，每个 job timeout-minutes = 300 (5h)
#             Job1 sync_source  -> 拉源码 / 装交叉工具链 / 修 shebang / 删设备树 / 缓存 .repo
#             Job2 build_stage1 -> 16G swap / lunch / -j1 编译「除 metalava 外全部 ninja 目标」
#             Job3 build_stage2 -> 串行单独执行 metalava + update-api
#             Job4 build_stage3 -> 镜像打包，导出 ARM64 *.img
#  失败处理 : 任意 job 失败时 always() 上传 ci_logs/ + out 下 *.log 作为 artifact
#
#  声明 : 本流水线仅用于 Android 安全研究与逆向教学。
# =============================================================================

name: AOSP10-arm64-cloud-build

# ------------------------------------------------------------------ 触发器 ----
on:
  workflow_dispatch:
    inputs:
      aosp_tag:
        description: 'AOSP release tag (repo init -b <tag>)'
        required: false
        default: 'android-10.0.0_r47'
      sync_jobs:
        description: 'repo sync 并发数（云端 runner 建议 4）'
        required: false
        default: '4'
      out_pack_mode:
        description: 'out 目录打包模式：slim=裁剪可再生中间物(默认) / full=原样全量'
        required: false
        default: 'slim'
      compile_shards:
        description: '编译 job(shard) 数量。-j1 全量编译需 5~8h，单 job 上限 5h，故拆分。每个 shard 约 250 分钟有效编译时间；不够就调大此值（并复制一个 build_stage1c job）'
        required: false
        default: '2'
      shard_budget_min:
        description: '每个编译 shard 的 ninja 时间预算（分钟）。需给 swap/repo sync/打包上传留出时间，故 < 300'
        required: false
        default: '250'
  push:
    branches:
      - 'main'
      - 'ci/**'
  # 如需每天定时出包，取消下面注释（注意会产生 artifact 存储计费）
  # schedule:
  #   - cron: '0 18 * * *'

# ------------------------------------------------------------------ 并发锁 ----
# AOSP 单次全量编译时间极长，禁止并发抢占，否则浪费 5h 机时
concurrency:
  group: aosp10-arm64-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------------ 权限 ------
permissions:
  contents: read

# -----------------------------------------------------------------------------
#  Runner 版本说明（重要，不要盲目改成 ubuntu-latest）
# -----------------------------------------------------------------------------
#  实测结论（2026-10-02，runner-images 20260927）：
#    ubuntu-latest  = Ubuntu 24.04.5  gcc 13.3 / clang 18 / Python 3.12 / Java 17
#    ubuntu-22.04   = Ubuntu 22.04.5  gcc 11.4 / clang 14 / Python 3.10 / Java 11
#
#  AOSP 10 必须在 22.04 上编译，原因：
#    1) Python 3.12 移除了 distutils，build/make、build/soong、external/* 里的
#       python 工具会直接 ModuleNotFoundError 崩掉
#    2) gcc 13 对 AOSP 10 的 host 模块 (-Werror) 会报出一批新告警直接失败
#    3) AOSP 10 要求 JDK 11，24.04 默认 JDK 17
#
#  而且 GitHub 官方公告：ubuntu-latest 将在 2026-10-19 迁移到 Ubuntu 26。
#  所以这里用 vars.AOSP_RUNNER_OS（仓库级 Variable，可不改代码切换），
#  默认硬编码到 ubuntu-22.04，不随 latest 漂移。
#  要切换时：Settings → Secrets and variables → Actions → Variables
#            新建 AOSP_RUNNER_OS = ubuntu-22.04
# --------------------------------------------------------------------------

# ------------------------------------------------------------- 默认 shell -----
defaults:
  run:
    shell: bash

# ------------------------------------------------------------------ 全局 env ---
env:
  # --- AOSP 版本与源码 ---
  AOSP_TAG: ${{ inputs.aosp_tag || 'android-10.0.0_r47' }}
  AOSP_MANIFEST_URL: 'https://android.googlesource.com/platform/manifest'
  # 可选：走国内镜像加速，留空则用官方源。例如 https://mirrors.tuna.tsinghua.edu.cn/git/android-platform-manifest
  AOSP_MIRROR_MANIFEST: ''
  # AOSP 源码目录。
  #   注意：GitHub runner 上 /mnt 由 root 拥有，runner 用户无权 mkdir，
  #   所以不能用 /mnt/aosp（实测 Permission denied）。整块盘只有一个 ext4 根卷，
  #   任何路径的可用空间都一样，因此放在 $HOME 下即可。
  AOSP_SRC_DIR: '/home/runner/aosp'
  # 目标产品/变体
  AOSP_LUNCH_TARGET: 'aosp_arm64-eng'
  AOSP_OUT_PRODUCT_DIR: 'arm64'          # out/target/product/arm64
  AOSP_REPO_SYNC_JOBS: ${{ inputs.sync_jobs || '4' }}
  # repo sync 网络重试（硬性要求：--retry-fetches=3）
  AOSP_REPO_RETRY_FETCHES: '3'
  # AOSP 10 不用 git-lfs；脚本还会对 repo 参数做能力探测（apt 的 repo 2.17 缺 --git-lfs）
  AOSP_REPO_GIT_LFS: '0'
  # 浅克隆，显著降低 .git 体积（.repo 是唯一被缓存的目录）
  AOSP_REPO_DEPTH: '1'

  # --- 编译参数 ---
  AOSP_BUILD_JOBS: '1'                  # 硬性要求：-j1 串行，规避云端 runner OOM
  AOSP_BUILD_KEEP_GOING: '0'            # 0 = fail fast；1 = -k 0（继续编完能编的）
  AOSP_CCACHE_ENABLE: '0'               # 云端 runner 磁盘/IO 有限，关闭 ccache
  AOSP_LMBGEN: '0'                      # 关闭 BuildImage lz4 压缩，加快打包
  AOSP_SKIP_METALAVA: '1'               # Job2 已在单独阶段执行，Job1 一律排除
  AOSP_METALAVA_TARGETS: 'metalava metalava-full metalava-sdk update-api'

  # --- Job4 镜像打包目标 ---
  AOSP_STAGE3_IMAGE_TARGETS: 'systemimg vendorimg odmimg productimg ramdisk userdataimg vbmetaimg'

  # --- 资源 ---
  #  runner 实测规格（ubuntu-22.04, image 20260927.309, 2026-10-02）:
  #    CPU 4 核 / RAM 15GiB / 预置 swap 3GiB
  #    磁盘: /dev/root ext4 146G，已用 59G，可用 87G（只有这一个卷，/mnt 不可写）
  #  已实测: AOSP 10 repo sync --depth=1 占用 ~62GB
  #  已实测: larger runner (ubuntu-22.04-large/2xlarge/4xlarge) 在本账号不会被调度（一直 queued）
  #
  #  磁盘回收（lib/reclaim_disk.sh）—— 不做就一定装不下：
  #    87GB - 62GB 源码 = 25GB，而 out 需要 30~50GB
  #    回收预装的 Android SDK(11G) / dotnet(5.8G) / swift(3.5G) 等 ~22GB
  #    => 109GB - 62GB = 47GB 给 out，可行
  AOSP_RECLAIM_DISK: '1'
  AOSP_RECLAIM_TOOLCACHE_GB: '4'       # hostedtoolcache 超此值才清历史 node 版本（绝不整个删）
  AOSP_SWAP_SIZE_GB: '16'               # 硬性要求：16G swap
  AOSP_SWAP_FILE: '/home/runner/aosp.swap'
  # auto = 优先 zram(内存压缩盘，不占磁盘)，磁盘宽裕时再加 swap 文件。
  #        47GB 要留给 out，16G swap 文件会直接吃掉三分之一。
  AOSP_SWAP_MODE: 'auto'
  AOSP_ENABLE_SWAP: '1'
  AOSP_FREE_SPACE_GB: '40'              # 开工前剩余空间不足该值则直接失败
  # 编译前容量预估：源码实测 + swap + out 预估，超过可用空间则提前失败并给出建议
  AOSP_OUT_ESTIMATE_GB: '42'            # aosp_arm64-eng 全量 out 的保守估计
  AOSP_FREE_SPACE_GUARD: '1'            # 1=启用预估守卫, 0=只打印警告

  # --- out 目录跨 job 传递 ---
  # slim = 裁掉可再生的中间物（obj/PACKAGES、obj/SOURCES、install staging 目录），
  #         体积可降 40%~70%，且不影响 Job3(metalava) / Job4(镜像打包) 的正确性
  AOSP_OUT_PACK_MODE: ${{ inputs.out_pack_mode || 'slim' }}
  AOSP_OUT_PACK_LEVEL: '3'              # zstd 压缩等级 1~19，3 为速度/体积平衡点
  AOSP_OUT_PART_MB: '8000'              # 分片大小(MB)，规避单文件/单 artifact 体积上限
  AOSP_ARTIFACT_RETENTION_DAYS: '5'     # out 中间产物保留天数（镜像产物用 30）

  # --- 缓存（只缓存 .repo，out 目录绝对不进 cache） ---
  CACHE_REPO_ENABLED: 'true'
  CACHE_REPO_PATH: '.repo'
  CACHE_REPO_KEY_PREFIX: 'aosp10-r47-repo'
  CACHE_REPO_MAX_GB: '10'               # GitHub 仓库缓存总配额 10GB，见 README 计费提醒

  # --- 补丁 ---
  PATCH_DIR: ${{ github.workspace }}/patches
  PATCH_APPLY_ENABLED: '1'

  # --- shebang 修复策略 ---
  # 0 = 一律把 python/python2 shebang 改写成 python3（CI 推荐，结果确定可复现）
  # 1 = 本机若已存在该解释器就跳过（本地开发机推荐，保留 python2 老脚本）
  AOSP_SHEBANG_SKIP_EXISTING: '0'

  # --- 日志 ---
  CI_LOG_DIR: ${{ github.workspace }}/ci_logs

jobs:
  # ===========================================================================
  # Job 1 / 4 —— sync_source
  #   职责：宿主依赖 + ARM64 交叉编译工具链、repo sync(--retry-fetches=3)、
  #         python shebang 修复、删除 crosshatch/bonito 设备树、缓存 .repo
  # ===========================================================================
  sync_source:
    name: '1/5 sync_source (repo sync + 工具链 + 补丁)'
    runs-on: ${{ vars.AOSP_RUNNER_OS || 'ubuntu-22.04' }}
    timeout-minutes: 300
    environment: aosp-build          # 便于在仓库 Settings -> Environments 加审批与计费归类

    steps:
      - name: '打印 runner 规格与磁盘布局'
        run: |
          set -euo pipefail
          echo "runner : $(uname -a)"
          echo "cpu    : $(nproc)  mem: $(free -h | awk '/Mem:/{print $2}')"
          echo "--- df -h ---"; df -hT
          echo "--- 提示：ubuntu-latest 只有一块 ~72GB SSD，AOSP 全量 + out 远超该容量 ---"
          echo "--- 详细容量分析与可选项见 CI 仓库 README.md「硬性容量约束」章节 ---"

      - name: 'Checkout CI 仓库（只含 workflow / build_scripts / patches）'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: '安装宿主依赖 + ARM64 交叉编译工具链'
        run: |
          set -euo pipefail
          chmod +x build_scripts/*.sh build_scripts/lib/*.sh
          ./build_scripts/prepare_runner.sh --deps-only

      - name: 'repo init（浅克隆 + 重试参数）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --init

      - name: '恢复 .repo 缓存（仅 .repo，out 永不进 cache）'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-

      - name: 'repo sync（--retry-fetches=3 抗网络抖动）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --sync

      - name: 'python shebang 修复（Ubuntu 22.04 兼容）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --fix-python

      - name: '删除 crosshatch / bonito 设备树'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --prune-device-trees

      - name: '批量 apply CI 仓库 patches/ 下的补丁'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --apply-patches

      - name: '可选：裁剪 AOSP 中与 arm64 参考镜像无关的源码（省磁盘）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --prune-source

      - name: '可选：repo repack（进一步压缩 .git 体积，利于 10GB 缓存配额）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --repack

      - name: '保存 .repo 缓存'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}

      - name: '源码清单落盘（便于排查 sync 差异）'
        run: |
          set -euo pipefail
          mkdir -p ci_logs
          {
            echo "# AOSP_TAG=$AOSP_TAG"
            echo "# generated_at=$(date -u +%FT%TZ)"
            echo "## disk"
            df -hT || true
            echo "## repo projects"
            ls -1 "${AOSP_SRC_DIR}/.repo/projects" 2>/dev/null | head -n 50 || true
            echo "## source size"
            du -sh "${AOSP_SRC_DIR}" 2>/dev/null || true
          } | tee ci_logs/sync_source_summary.txt

      - name: '上传 Job1 日志（失败也上传）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-1-sync
          path: |
            ci_logs/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  # ===========================================================================
  # Job 2 / 5 —— build_stage1a （编译 shard 1/N）
  #   职责：16G swap、lunch aosp_arm64-eng、-j1 编译「除 metalava 外全部 ninja 目标」
  #         跑到时间预算就优雅停止 -> 打包 out -> artifact
  #
  #   【为什么拆成多个编译 job】
  #   -j1 编译 aosp_arm64-eng 全量目标实测需要 5~8 小时，而单 job 硬上限 300 分钟。
  #   拆成 N 个 shard：AOSP_COMPILE_SHARDS 控制个数，N 个 job 串行。
  #
  #   【分片原理：不按目标名切分，按时间预算 + 增量续跑】
  #   每个 shard 跑**同一份完整目标清单**。ninja 天然跳过已完成的边，
  #   所以 shard2 会自动从 shard1 停下的地方接着编，工作量自然向后流动。
  #   这样零拓扑分析风险（按名字切分会破坏依赖顺序或让下游重做上游的活）。
  # ===========================================================================
  build_stage1a:
    name: '2/5 build_stage1a (编译 shard 1/${{ inputs.compile_shards || 2 }})'
    needs: sync_source
    runs-on: ${{ vars.AOSP_RUNNER_OS || 'ubuntu-22.04' }}
    timeout-minutes: 300
    environment: aosp-build
    env:
      AOSP_SHARD_INDEX: '1'
      AOSP_SHARD_TOTAL: ${{ inputs.compile_shards || '2' }}
      AOSP_SHARD_BUDGET_MIN: ${{ inputs.shard_budget_min || '250' }}
      AOSP_SHARD_DOWNLOAD: '0'
      AOSP_SHARD_REQUIRE_COMPLETE: '0'

    steps:
      - name: '打印 runner 规格与磁盘布局'
        run: |
          set -euo pipefail
          df -hT; free -h; nproc

      - name: 'Checkout CI 仓库'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: '安装宿主依赖 + ARM64 交叉编译工具链'
        run: |
          set -euo pipefail
          chmod +x build_scripts/*.sh build_scripts/lib/*.sh
          ./build_scripts/prepare_runner.sh --deps-only

      - name: '恢复 .repo 缓存（跳过网络重复拉取 manifest 与 refs）'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-

      - name: 'repo sync（命中 .repo 缓存后主要耗时在 checkout 落盘）'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --init
          ./build_scripts/sync_source.sh --sync

      - name: 'python shebang 修复 + 删除 crosshatch/bonito + 批量 apply 补丁'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --fix-python
          ./build_scripts/sync_source.sh --prune-device-trees
          ./build_scripts/sync_source.sh --apply-patches

      - name: '准备 16G swap + 空间守卫'
        run: |
          set -euo pipefail
          ./build_scripts/prepare_runner.sh --swap-only

      - name: '编译 shard 1（-j1，排除 metalava，时间预算内增量编译）'
        run: |
          set -euo pipefail
          ./build_scripts/stage1_build.sh

      - name: '上传编译日志（失败也上传，便于排错）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-shard1
          path: |
            ci_logs/
            out/soong/*.log
            out/err.log
            out/*.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: '打包 out 目录（分片 zstd，供后续 shard 增量续跑）'
        if: success()
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh pack

      - name: '上传 out 产物（分片 artifact）'
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: out-shard1
          path: .ci_artifacts/out/part-*
          retention-days: ${{ env.AOSP_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0        # 已用 zstd 预压缩，禁止二次压缩
          overwrite: true

  # ===========================================================================
  # Job 3 / 5 —— build_stage1b （编译 shard 2/N，最后一个必须编完）
  #   与 1a 跑同一份目标清单，ninja 跳过已完成部分继续往后编。
  #   若 2 个 shard 不够，把 compile_shards 调到 3，并复制本 job 一份改成 3c。
  # ===========================================================================
  build_stage1b:
    name: '3/5 build_stage1b (编译 shard 2/${{ inputs.compile_shards || 2 }})'
    needs: build_stage1a
    runs-on: ${{ vars.AOSP_RUNNER_OS || 'ubuntu-22.04' }}
    timeout-minutes: 300
    environment: aosp-build
    env:
      AOSP_SHARD_INDEX: '2'
      AOSP_SHARD_TOTAL: ${{ inputs.compile_shards || '2' }}
      AOSP_SHARD_BUDGET_MIN: ${{ inputs.shard_budget_min || '250' }}
      AOSP_SHARD_DOWNLOAD: '1'
      # 最后一个 shard 必须把目标编完，否则直接失败并提示调大 compile_shards
      AOSP_SHARD_REQUIRE_COMPLETE: '1'

    steps:
      - name: '打印 runner 规格与磁盘布局'
        run: |
          set -euo pipefail
          df -hT; free -h; nproc

      - name: 'Checkout CI 仓库'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: '安装宿主依赖 + ARM64 交叉编译工具链'
        run: |
          set -euo pipefail
          chmod +x build_scripts/*.sh build_scripts/lib/*.sh
          ./build_scripts/prepare_runner.sh --deps-only

      - name: '恢复 .repo 缓存'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-

      - name: 'repo sync'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --init
          ./build_scripts/sync_source.sh --sync
          ./build_scripts/sync_source.sh --fix-python
          ./build_scripts/sync_source.sh --prune-device-trees
          ./build_scripts/sync_source.sh --apply-patches

      - name: '准备 16G swap + 空间守卫'
        run: |
          set -euo pipefail
          ./build_scripts/prepare_runner.sh --swap-only

      - name: '下载 shard 1 的 out 产物（增量续跑的前提）'
        uses: actions/download-artifact@v8
        with:
          name: out-shard1
          path: .ci_artifacts/out

      - name: '解包 out 目录（还原权限/符号链接/硬链接）'
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh unpack

      - name: '编译 shard 2（-j1，增量续跑，必须编完）'
        run: |
          set -euo pipefail
          ./build_scripts/stage1_build.sh

      - name: '上传编译日志（失败也上传，便于排错）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-shard2
          path: |
            ci_logs/
            out/soong/*.log
            out/err.log
            out/*.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: '打包 out 目录（供 metalava 阶段使用）'
        if: success()
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh pack

      - name: '上传 out 产物（分片 artifact）'
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: out-shard2
          path: .ci_artifacts/out/part-*
          retention-days: ${{ env.AOSP_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # ===========================================================================
  # Job 3 / 4 —— build_stage2 (metalava)
  #   职责：下载 stage1 的 out，串行单独执行所有 metalava 任务（含 update-api）
  # ===========================================================================
  build_stage2:
    name: '4/5 build_stage2 (metalava 串行专项)'
    needs: build_stage1b
    runs-on: ${{ vars.AOSP_RUNNER_OS || 'ubuntu-22.04' }}
    timeout-minutes: 300
    environment: aosp-build

    steps:
      - name: '打印 runner 规格与磁盘布局'
        run: |
          set -euo pipefail
          df -hT; free -h; nproc

      - name: 'Checkout CI 仓库'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: '安装宿主依赖 + ARM64 交叉编译工具链'
        run: |
          set -euo pipefail
          chmod +x build_scripts/*.sh build_scripts/lib/*.sh
          ./build_scripts/prepare_runner.sh --deps-only

      - name: '恢复 .repo 缓存'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-

      - name: 'repo sync'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --init
          ./build_scripts/sync_source.sh --sync
          ./build_scripts/sync_source.sh --fix-python
          ./build_scripts/sync_source.sh --prune-device-trees
          ./build_scripts/sync_source.sh --apply-patches

      - name: '准备 16G swap + 空间守卫'
        run: |
          set -euo pipefail
          ./build_scripts/prepare_runner.sh --swap-only

      - name: '下载最后一个编译 shard 的 out 产物'
        uses: actions/download-artifact@v8
        with:
          name: out-shard2
          path: .ci_artifacts/out

      - name: '解包 out 目录（还原权限/符号链接/硬链接）'
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh unpack

      - name: 'stage2 串行执行 metalava 全部任务'
        run: |
          set -euo pipefail
          ./build_scripts/stage2_metalava.sh

      - name: '上传编译日志（失败也上传）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-4-metalava
          path: |
            ci_logs/
            out/soong/*.log
            out/err.log
            out/*.log
            frameworks/base/api/current.txt
            prebuilts/sdk/current/**/api/current.txt
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: '打包 out 目录（供 Job4 下载）'
        if: success()
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh pack

      - name: '上传 out 产物（分片 artifact）'
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: out-stage2
          path: .ci_artifacts/out/part-*
          retention-days: ${{ env.AOSP_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # ===========================================================================
  # Job 4 / 4 —— build_stage3 (镜像打包)
  #   职责：下载 metalava 阶段 out，执行镜像打包，导出 ARM64 system.img/vendor.img 等
  # ===========================================================================
  build_stage3:
    name: '5/5 build_stage3 (镜像打包 system.img/vendor.img)'
    needs: build_stage2
    runs-on: ${{ vars.AOSP_RUNNER_OS || 'ubuntu-22.04' }}
    timeout-minutes: 300
    environment: aosp-build

    steps:
      - name: '打印 runner 规格与磁盘布局'
        run: |
          set -euo pipefail
          df -hT; free -h; nproc

      - name: 'Checkout CI 仓库'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: '安装宿主依赖 + ARM64 交叉编译工具链'
        run: |
          set -euo pipefail
          chmod +x build_scripts/*.sh build_scripts/lib/*.sh
          ./build_scripts/prepare_runner.sh --deps-only

      - name: '恢复 .repo 缓存'
        if: env.CACHE_REPO_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_REPO_PATH }}
          key: ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-${{ env.AOSP_REPO_DEPTH }}-
            ${{ env.CACHE_REPO_KEY_PREFIX }}-${{ runner.os }}-${{ env.AOSP_TAG }}-

      - name: 'repo sync'
        run: |
          set -euo pipefail
          ./build_scripts/sync_source.sh --init
          ./build_scripts/sync_source.sh --sync
          ./build_scripts/sync_source.sh --fix-python
          ./build_scripts/sync_source.sh --prune-device-trees
          ./build_scripts/sync_source.sh --apply-patches

      - name: '准备 16G swap + 空间守卫'
        run: |
          set -euo pipefail
          ./build_scripts/prepare_runner.sh --swap-only

      - name: '下载 metalava 阶段 out 产物'
        uses: actions/download-artifact@v8
        with:
          name: out-stage2
          path: .ci_artifacts/out

      - name: '解包 out 目录'
        run: |
          set -euo pipefail
          ./build_scripts/lib/artifacts.sh unpack

      - name: 'stage3 镜像打包'
        run: |
          set -euo pipefail
          ./build_scripts/stage3_package.sh

      - name: '导出镜像 + 校验信息'
        if: always()
        run: |
          set -euo pipefail
          ./build_scripts/stage3_package.sh --collect-only || true

      - name: '上传编译日志（失败也上传）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-5-package
          path: |
            ci_logs/
            out/soong/*.log
            out/err.log
            out/*.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: '上传最终 ARM64 镜像 artifact（长期保留）'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aosp_arm64-eng-images
          path: |
            dist_images/*.img
            dist_images/*.zip
            dist_images/SHA256SUMS
            dist_images/BUILD_INFO.txt
            dist_images/mapping-*.txt
            dist_images/otapackages/*.zip
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
          overwrite: true
